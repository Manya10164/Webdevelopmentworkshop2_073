<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="logo">amazon.in</div>

    <input type="text" placeholder="Search Amazon.in" class="search-box">

    <div class="nav-links">
        <p>Hello, Sign in</p>
        <p>Returns & Orders</p>
        <p>Cart 🛒</p>
    </div>
</header>

<!-- HERO BANNER -->
<section class="banner">
    <h2>UNDER ₹499</h2>
    <p>Glam face makeup</p>
</section>

<!-- PRODUCTS GRID -->
<section class="products">

    <div class="card">
        <h3>Appliances for your home</h3>
        <img src="homeappli.png">
        <p>Up to 55% off</p>
    </div>

    <div class="card">
        <h3>Revamp your home</h3>
        <img src="ho">
        <p>Decor & Style</p>
    </div>

    <div class="card">
        <h3>Bulk order discounts</h3>
        <img src="https://via.placeholder.com/150">
        <p>Up to 18% GST savings</p>
    </div>

    <div class="card">
        <h3>Home essentials</h3>
        <img src="https://via.placeholder.com/150">
        <p>Starting ₹49</p>
    </div>

</section>

<!-- FOOTER -->
<footer class="footer">
    <p>© 2026 Amazon Clone Project</p>
</footer>

</body>
</html>
